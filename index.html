<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📋 프롬프트 가이드</title>
<style>
  :root{
    --bg:#0e1424; --card:#161e33; --line:#26304d; --ink:#eef2ff; --mut:#93a0c4;
    --accent:#5b8cff; --accent2:#7c5cff; --good:#33d69f; --danger:#ff6b81;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 700px at 70% -10%, #1c2747 0%, var(--bg) 60%);
    color:var(--ink); font-family:"Pretendard","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
  .hidden{display:none!important}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-weight:700}
  input,textarea{font-family:inherit;font-size:16px;padding:13px 15px;border-radius:12px;border:1px solid var(--line);
    background:#0e1730;color:var(--ink);width:100%}
  input::placeholder,textarea::placeholder{color:#5e6c92}
  textarea{resize:vertical;min-height:200px;line-height:1.7}
  .muted{color:var(--mut)} .small{font-size:13px}
  .btn-lg{font-size:17px;padding:15px 20px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .btn-ghost{background:#222c47;color:var(--ink);border:1px solid var(--line);font-size:15px;padding:14px 18px}
  .btn-danger{background:#2a1620;color:var(--danger);border:1px solid #5a2333;font-size:14px;padding:12px 16px}
  .err{background:#3a1320;border:1px solid #6b2233;color:#ffb3c0;padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:12px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0b1126;border:1px solid var(--line);
    color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;display:none;z-index:50}

  /* ===== 작업실(사이드바+에디터) ===== */
  .workspace{display:flex;gap:18px;max-width:1080px;margin:0 auto;padding:20px 16px;min-height:100vh}
  .sidebar{flex:0 0 260px;width:260px;display:flex;flex-direction:column;gap:12px}
  .brand{font-size:20px;font-weight:900;margin:4px 2px 8px}
  .btn-new{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:14px;font-size:15px}
  .proj-list{display:flex;flex-direction:column;gap:8px;flex:1;overflow:auto}
  .proj-item{display:flex;align-items:center;gap:6px}
  .proj-open{flex:1;text-align:left;background:#1b2440;border:1px solid var(--line);color:var(--ink);
    padding:13px 14px;border-radius:11px;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proj-open.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
  .proj-open .cnt{font-weight:500;color:var(--mut);font-size:13px}
  .proj-open.active .cnt{color:#dbe4ff}
  .side-join{border-top:1px solid var(--line);padding-top:12px}
  .side-join .row{display:flex;gap:6px;margin-top:6px}
  .editor{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0}
  .lbl{display:block;font-weight:700;margin:16px 0 7px;font-size:14px}
  .lbl:first-of-type{margin-top:0}
  .editor-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .editor-actions .btn-lg{flex:1} .editor-actions .btn-ghost{flex:1}
  .step-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
  .step-num{flex:0 0 auto;width:28px;height:28px;margin-top:7px;border-radius:8px;background:#1b2440;border:1px solid var(--line);
    color:var(--accent);font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
  .step-input{min-height:50px;line-height:1.5}
  .step-del{flex:0 0 auto;width:38px;align-self:stretch;background:#241622;border:1px solid #4a2330;color:#ffb3c0;border-radius:10px;font-size:14px}
  .bulk{background:#0e1730;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px}
  .bulk summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--mut)}
  .bulk textarea{margin-top:10px;min-height:90px}

  /* ===== 수업 운영 ===== */
  .run-wrap{max-width:820px;margin:0 auto;padding:20px 16px}
  .link-btn{background:none;border:none;color:var(--mut);font-size:14px;padding:6px 0;text-decoration:underline}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0}
  .joinbox{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .qr{background:#fff;border-radius:12px;padding:8px;width:150px;height:150px}
  .code-big{font-size:40px;letter-spacing:7px;font-weight:900;color:#fff}
  .meta{display:flex;justify-content:space-between;align-items:center;margin:8px 2px;color:var(--mut);font-size:14px}
  .preview{background:#0b1126;border:1px solid var(--line);border-radius:14px;padding:18px;min-height:90px}
  .pv-line{font-size:17px;line-height:1.55;padding:7px 10px;margin:5px 0;border-radius:9px;white-space:pre-wrap}
  .pv-line.base{font-weight:800;background:#13203f}
  .pv-line.new{background:rgba(51,214,159,.14);outline:1px solid rgba(51,214,159,.45)}
  .controls{display:flex;gap:10px;margin-top:16px}
  .controls .btn-lg{flex:2} .controls .btn-ghost{flex:1}
  .roster{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{background:#1b2440;border:1px solid var(--line);color:var(--mut);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600}

  /* ===== 학생 — 이름 입력 ===== */
  .center-wrap{max-width:520px;margin:0 auto;padding:40px 18px}
  .pill{display:inline-block;background:#0e1730;border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:800;letter-spacing:3px}

  /* ===== 학생 — 화이트보드 ===== */
  .wb-wrap{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#eef2f4}
  .paper{position:relative;background:#d9ebec;color:#3a4048;width:100%;max-width:880px;min-height:64vh;
    padding:64px 52px 72px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 18px 44px rgba(60,90,100,.22);
    clip-path:polygon(0% 0%,100% 0%,100% 95%,96% 100%,91% 94.5%,86% 99.5%,81% 95%,76% 100%,71% 94.5%,66% 98.5%,
      61% 95%,56% 100%,51% 94.5%,46% 99.5%,41% 95%,36% 100%,31% 94.5%,26% 98.5%,21% 95%,16% 100%,11% 94.5%,6% 99.5%,0% 95%)}
  .paper-box{position:relative;width:100%;max-width:880px}
  .washi{position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(-4deg);width:236px;height:auto;
    opacity:.82;z-index:2;filter:drop-shadow(0 2px 2px rgba(70,110,130,.18))}
  .wb-copy{position:absolute;right:max(20px,4vw);bottom:max(18px,3vh);background:none;border:none;padding:6px;cursor:pointer}
  .wb-copy:active{transform:scale(.92)}
  .wb-page{width:100%;text-align:center}
  .wb-wait{color:#7e96a0;font-size:18px}
  .wb-line{font-size:26px;line-height:1.7;color:#2c333b;margin:14px 0;white-space:pre-wrap}
  .wb-line.wb-base{font-weight:700}
  .wb-page.flip{animation:pageturn .55s cubic-bezier(.2,.7,.3,1)}
  @keyframes pageturn{
    0%{opacity:.15;transform:perspective(1400px) rotateY(-36deg) translateX(46px);transform-origin:left center}
    100%{opacity:1;transform:none}
  }
</style>
</head>
<body>
  <div id="loading" class="center-wrap"><p class="muted">연결 중…</p></div>

  <!-- ===== 강사 작업실 ===== -->
  <div id="workspace" class="workspace hidden">
    <aside class="sidebar">
      <div class="brand">📋 프롬프트 가이드</div>
      <button id="newBtn" class="btn-new">➕ 새 프로젝트</button>
      <div id="projList" class="proj-list"></div>
    </aside>
    <main class="editor">
      <div id="editorErr" class="err hidden"></div>
      <label class="lbl">프로젝트 이름</label>
      <input id="projName" placeholder="예: 이름 뽑기 만들기" maxlength="40" />
      <label class="lbl">프롬프트 단계 — 단계마다 한 페이지 (한 단계 안엔 여러 줄 OK)</label>
      <details id="bulkBox" class="bulk">
        <summary>📋 표·목록 한 번에 붙여넣기</summary>
        <textarea id="bulkInput" rows="4" placeholder="엑셀 표나 목록을 여기에 붙여넣으세요.&#10;한 줄(행)이 한 단계가 됩니다 → 행 수만큼 자동으로 칸이 생겨요."></textarea>
        <button id="bulkApply" class="btn-ghost" style="width:100%;margin-top:6px">↓ 단계로 만들기</button>
      </details>
      <div id="stepList"></div>
      <button id="addStepBtn" class="btn-ghost" style="width:100%;margin-top:8px">➕ 단계 추가</button>
      <div class="editor-actions">
        <button id="saveBtn" class="btn-lg">💾 저장</button>
        <button id="startBtn" class="btn-ghost">▶ 수업 시작</button>
        <button id="delBtn" class="btn-danger hidden">🗑 삭제</button>
      </div>
      <p class="muted small">💡 저장하면 왼쪽 목록에 추가돼요. 다음에 다시 불러와 쓸 수 있어요. "수업 시작"을 누르면 학생 공유 링크가 만들어집니다.</p>
    </main>
  </div>

  <!-- ===== 수업 운영 ===== -->
  <div id="run" class="run-wrap hidden">
    <button id="backWs" class="link-btn">← 작업실로 돌아가기</button>
    <h1 id="runTitle" style="margin:6px 0 0">수업</h1>
    <div class="card">
      <div class="joinbox">
        <img id="qr" class="qr" alt="QR" />
        <div style="flex:1;min-width:200px">
          <p class="muted" style="margin:0 0 6px">학생 입장 코드</p>
          <div class="code-big" id="codeBig">––––––</div>
          <p class="muted small" style="margin:12px 0 4px">👇 이 링크를 패들렛에 붙여 학생에게 공유하세요</p>
          <input id="joinUrl" readonly style="font-size:13px;cursor:text" onclick="this.select()" />
          <button id="copyLink" class="btn-ghost" style="margin-top:8px;width:100%">🔗 학생 링크 복사</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="meta">
        <span style="font-weight:800">학생에게 보이는 페이지</span>
        <span class="code-big" id="pageNo" style="font-size:20px">1 / 1</span>
      </div>
      <div class="preview" id="preview"></div>
      <div class="controls">
        <button id="nextBtn" class="btn-lg">다음 페이지 ▶</button>
        <button id="prevBtn" class="btn-ghost">◀ 이전</button>
      </div>
      <div class="meta" style="margin-top:14px"><span class="muted">접속 학생 <b id="ptCount">0</b>명</span></div>
      <div id="roster" class="roster"></div>
    </div>
  </div>

  <!-- ===== 학생 — 이름 입력 ===== -->
  <div id="sJoin" class="center-wrap hidden">
    <h1>🧑‍🎓 입장하기</h1>
    <p class="muted">참여 코드 <span class="pill" id="sJoinCode"></span></p>
    <div class="card">
      <p style="margin:0 0 10px;font-weight:700">이름을 입력하고 입장하세요</p>
      <input id="sName" placeholder="이름 (예: 김민수)" maxlength="20" />
      <div style="display:flex;gap:10px;margin-top:12px">
        <button id="sEnterNamed" class="btn-lg" style="flex:1">입장</button>
        <button id="sEnterAnon" class="btn-ghost" style="flex:0 0 auto">익명으로</button>
      </div>
    </div>
    <div id="sJoinErr" class="err hidden"></div>
  </div>

  <!-- ===== 학생 — 종이 메모 ===== -->
  <div id="student" class="wb-wrap hidden">
    <div class="paper-box">
      <div class="paper">
        <div class="wb-page" id="stageS"><p class="wb-wait">선생님이 시작하기를 기다리고 있어요…</p></div>
      </div>
      <svg class="washi" viewBox="0 0 240 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <pattern id="gingham" width="14" height="14" patternUnits="userSpaceOnUse">
            <rect width="14" height="14" fill="#cfe6f1"/>
            <rect width="7" height="14" fill="#9cc6e0"/>
            <rect width="14" height="7" fill="#9cc6e0"/>
            <rect width="7" height="7" fill="#6aa6cf"/>
          </pattern>
        </defs>
        <path d="M14,6 L226,6 L234,11 L226,17 L234,23 L226,29 L234,35 L226,41 L234,47 L226,50 L14,50 L6,45 L14,39 L6,33 L14,27 L6,21 L14,15 L6,9 Z" fill="url(#gingham)"/>
      </svg>
    </div>
    <button id="copyCur" class="wb-copy" title="프롬프트 복사" style="display:none">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2a2f38" stroke-width="1.6">
        <rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><rect x="4.5" y="4.5" width="11" height="11" rx="2.5" fill="#fff"/>
      </svg>
    </button>
  </div>

  <div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, update, onValue, onDisconnect, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// 라이브폴과 같은 Firebase 프로젝트 재사용 (공개되어도 되는 값, 보안은 규칙으로)
const firebaseConfig = {
  apiKey: "AIzaSyDxobMcpnBAMlcLeSILBR2k4sGoKxASk30",
  authDomain: "live-poll-c643b.firebaseapp.com",
  databaseURL: "https://live-poll-c643b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "live-poll-c643b",
  storageBucket: "live-poll-c643b.firebasestorage.app",
  messagingSenderId: "445248033842",
  appId: "1:445248033842:web:af51f031d206840281582b",
};

// ── 유틸 ──
const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove("hidden");
const hide = id => $(id).classList.add("hidden");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
let toastTimer;
function toast(m){ const t=$("toast"); t.textContent=m; t.style.display="block"; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display="none",1700); }
function fail(box,msg){ const e=$(box); e.textContent=msg; e.classList.remove("hidden"); }
function makeCode(){ const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<6;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
const stepsOf = txt => (txt||"").split("\n").map(s=>s.trim()).filter(Boolean);
const normLines = v => Array.isArray(v) ? v : Object.values(v||{});

// ── 효과음(책장 넘기기) ──
let audioCtx = null;
function ensureAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch{} }
function playFlip(){
  if(!audioCtx) return;
  try{
    const ctx=audioCtx, dur=0.24, buf=ctx.createBuffer(1, Math.floor(ctx.sampleRate*dur), ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){ const t=i/d.length; d[i]=(Math.random()*2-1)*(1-t)*(1-t); }
    const src=ctx.createBufferSource(); src.buffer=buf;
    const bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2400; bp.Q.value=0.6;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.45,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
    src.connect(bp).connect(g).connect(ctx.destination); src.start();
  }catch{}
}
function flip(el){ el.classList.remove("flip"); void el.offsetWidth; el.classList.add("flip"); }

// ── 프로젝트 저장 (이 컴퓨터) ──
function loadProjects(){ try{ return JSON.parse(localStorage.getItem("pg_projects")||"[]"); }catch{ return []; } }
function saveProjects(a){ localStorage.setItem("pg_projects", JSON.stringify(a)); }
function newId(){ return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// ── Firebase ──
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let uid = null;

onAuthStateChanged(auth, u => { if(u){ uid=u.uid; route(); } });
signInAnonymously(auth).catch(e => { hide("loading"); show("workspace"); renderProjects(); openEditor(null);
  fail("editorErr","로그인 실패: Firebase 콘솔에서 '익명 로그인'이 켜져 있는지 확인하세요. ("+e.message+")"); });

// ── 라우팅 ──
function route(){
  hide("loading");
  const q = new URLSearchParams(location.search);
  const board = (q.get("board")||"").toUpperCase();
  if (q.get("role")==="student" && board) return startStudent(board);
  show("workspace");
  renderProjects();
  openEditor(null);
  $("newBtn").onclick = () => openEditor(null);
  $("addStepBtn").onclick = addStep;
  $("bulkApply").onclick = () => bulkToSteps($("bulkInput").value);
  $("bulkInput").addEventListener("paste", e => {
    const rows = parsePasteRows(e);
    if (rows.length > 1) { e.preventDefault(); applyRows(rows); $("bulkInput").value=""; $("bulkBox").open=false; }
  });
  // 단계칸에 여러 행을 붙여넣으면 자동으로 칸이 나뉨
  $("stepList").addEventListener("paste", e => {
    if (!e.target || !e.target.classList || !e.target.classList.contains("step-input")) return;
    const rows = parsePasteRows(e);
    if (rows.length > 1) { e.preventDefault(); applyRows(rows); }
  });
  $("saveBtn").onclick = saveProject;
  $("startBtn").onclick = startClass;
  $("delBtn").onclick = deleteProject;
}

// ════════ 작업실 ════════
let editingId = null;

// 프로젝트 단계 = 문자열 배열. (옛 문자열 포맷도 허용)
const asSteps = v => Array.isArray(v) ? v.filter(s=>String(s).trim()) : stepsOf(v);

function renderProjects(){
  const list = loadProjects(), box = $("projList");
  box.innerHTML = list.length ? "" : '<p class="muted small" style="padding:4px 2px">아직 저장된 프로젝트가 없어요.<br>오른쪽에서 만들어 저장해보세요.</p>';
  list.forEach(p => {
    const item = document.createElement("div"); item.className="proj-item";
    const open = document.createElement("button");
    open.className = "proj-open" + (p.id===editingId?" active":"");
    open.innerHTML = `${esc(p.name||"이름 없음")} <span class="cnt">· ${asSteps(p.steps).length}단계</span>`;
    open.onclick = () => openEditor(p.id);
    item.appendChild(open); box.appendChild(item);
  });
}

// 단계 입력 칸 렌더 (각 칸 = 한 페이지, 여러 줄 가능)
function getStepsFromDOM(){ return [...document.querySelectorAll('.step-input')].map(t=>t.value); }
function renderSteps(steps){
  const box = $("stepList"); box.innerHTML = "";
  steps.forEach((s,i) => {
    const row = document.createElement("div"); row.className = "step-row";
    row.innerHTML = `<span class="step-num">${i+1}</span>`
      + `<textarea class="step-input" rows="2" placeholder="${i===0?"첫 페이지에 보여줄 프롬프트":"이 페이지에서 추가로 보여줄 프롬프트"} (여러 줄 OK)"></textarea>`
      + `<button class="step-del" title="이 단계 삭제">✕</button>`;
    row.querySelector(".step-input").value = s;
    row.querySelector(".step-del").onclick = () => {
      const cur = getStepsFromDOM(); cur.splice(i,1); renderSteps(cur.length?cur:[""]);
    };
    box.appendChild(row);
  });
}
function addStep(){
  const cur = getStepsFromDOM(); cur.push(""); renderSteps(cur);
  const ins = document.querySelectorAll('.step-input'); ins[ins.length-1].focus();
}
// 붙여넣기 → 행 배열로 파싱. 엑셀/시트면 HTML 표의 행 단위로(셀 안 줄바꿈 안전), 아니면 줄 단위로.
function parsePasteRows(e){
  const cb = e.clipboardData || window.clipboardData;
  const html = cb.getData("text/html");
  if (html && /<table/i.test(html)){
    const doc = new DOMParser().parseFromString(html, "text/html");
    return [...doc.querySelectorAll("tr")]
      .map(tr => [...tr.querySelectorAll("td,th")].map(td=>(td.textContent||"").replace(/\s+/g," ").trim()).filter(Boolean).join(" ").trim())
      .filter(Boolean);
  }
  return (cb.getData("text")||"").split(/\r?\n/).map(s=>s.replace(/\t+/g," ").trim()).filter(Boolean);
}
// 행 배열을 단계칸으로 (기존 입력 뒤에 추가)
function applyRows(rows){
  rows = rows.filter(Boolean);
  if (!rows.length) return false;
  const existing = getStepsFromDOM().map(s=>s.trim()).filter(Boolean);
  renderSteps([...existing, ...rows]);
  toast(`${rows.length}개 단계가 추가됐어요.`);
  return true;
}
function bulkToSteps(txt){
  const rows = (txt||"").split(/\r?\n/).map(s=>s.replace(/\t+/g," ").trim()).filter(Boolean);
  if (!applyRows(rows)) return toast("붙여넣은 내용이 없어요.");
  $("bulkInput").value = ""; $("bulkBox").open = false;
}

function openEditor(id){
  editingId = id;
  const p = loadProjects().find(x=>x.id===id);
  $("editorErr").classList.add("hidden");
  $("projName").value = p ? (p.name||"") : "";
  const steps = p ? asSteps(p.steps) : [];
  renderSteps(steps.length ? steps : [""]);
  $("delBtn").classList.toggle("hidden", !p);
  renderProjects();
}

function saveProject(){
  const name = $("projName").value.trim();
  const steps = getStepsFromDOM().map(s=>s.trim()).filter(Boolean);
  if (!name) return fail("editorErr","프로젝트 이름을 입력해주세요.");
  if (steps.length===0) return fail("editorErr","프롬프트 단계를 한 개 이상 입력해주세요.");
  $("editorErr").classList.add("hidden");
  const list = loadProjects();
  let p = list.find(x=>x.id===editingId);
  if (p){ p.name=name; p.steps=steps; }
  else { p={ id:newId(), name, steps, code:null }; list.push(p); editingId=p.id; }
  saveProjects(list); renderProjects();
  $("delBtn").classList.remove("hidden");
  toast("저장됐어요!");
}

function deleteProject(){
  if (!editingId) return;
  saveProjects(loadProjects().filter(x=>x.id!==editingId));
  openEditor(null);
  toast("삭제됐어요.");
}

// ════════ 수업 시작 ════════
async function startClass(){
  // 저장 먼저
  const name=$("projName").value.trim();
  if(!name || getStepsFromDOM().map(s=>s.trim()).filter(Boolean).length===0){ return fail("editorErr","이름과 프롬프트 단계를 입력하고 저장해주세요."); }
  saveProject();
  const project = loadProjects().find(x=>x.id===editingId);
  const lines = asSteps(project.steps);

  // 보드 확보(없거나 내 것이 아니면 새로 생성) → live에 프롬프트+1페이지 기록
  let code = project.code;
  try {
    let ok = false;
    if (code){ const m = await get(ref(db,`boards/${code}/meta`)); ok = m.exists() && m.val().hostId===uid; }
    if (!ok){
      for (let i=0;i<8;i++){ const c=makeCode(); const m=await get(ref(db,`boards/${c}/meta`));
        if (m.exists()) continue; await set(ref(db,`boards/${c}/meta`),{hostId:uid,createdAt:serverTimestamp()}); code=c; break; }
      project.code = code; const list=loadProjects(); const i=list.findIndex(x=>x.id===project.id); list[i]=project; saveProjects(list);
    }
    await set(ref(db,`boards/${code}/live`), { lines, count:1 });
  } catch(e){
    if (e.code==="PERMISSION_DENIED"||/permission/i.test(e.message))
      return fail("editorErr","Firebase 보안 규칙이 아직 게시되지 않았어요. 콘솔에서 규칙을 게시해주세요.");
    return fail("editorErr","수업 시작 실패: "+e.message);
  }
  openRun(project, code, lines);
}

function openRun(project, code, lines){
  hide("workspace"); show("run");
  $("runTitle").textContent = "▶ " + project.name;
  const url = location.origin + location.pathname + "?role=student&board=" + code;
  $("codeBig").textContent = code;
  $("joinUrl").value = url;
  $("qr").src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(url);
  $("copyLink").onclick = async () => { try{ await navigator.clipboard.writeText(url);}catch{} toast("학생 링크가 복사됐어요!"); };
  $("backWs").onclick = () => { hide("run"); show("workspace"); renderProjects(); };

  let count = 1; const total = lines.length;
  const liveRef = ref(db,`boards/${code}/live`);
  $("nextBtn").onclick = () => { if(count>=total) return; count++; update(liveRef,{count}); };
  $("prevBtn").onclick = () => { if(count<=1) return; count--; update(liveRef,{count}); };

  onValue(liveRef, s => { const L=s.val(); if(L && L.count){ count=L.count; } renderRun(lines, count, total); });
  onValue(ref(db,`boards/${code}/participants`), s => {
    const people = s.val()||{}; const ids=Object.keys(people);
    $("ptCount").textContent = ids.length;
    $("roster").innerHTML = ids.length ? ids.map(u=>`<span class="chip">${esc(people[u].name||"익명")}</span>`).join("")
      : '<span class="muted">아직 입장한 학생이 없어요.</span>';
  });
}

function renderRun(lines, count, total){
  $("pageNo").textContent = `${count} / ${total}`;
  $("preview").innerHTML = `<div class="pv-line base">${esc(lines[count-1]||"")}</div>`;
  $("nextBtn").disabled = count>=total;
  $("prevBtn").disabled = count<=1;
  $("nextBtn").textContent = count>=total ? "마지막 페이지 ✓" : "다음 페이지 ▶";
}

// ════════ 학생 — 이름 입력 ════════
async function startStudent(code){
  hide("workspace"); show("sJoin");
  $("sJoinCode").textContent = code;
  try {
    const m = await get(ref(db,`boards/${code}/meta`));
    if (!m.exists()) return fail("sJoinErr","그런 코드의 보드가 없어요. 코드를 다시 확인해주세요.");
  } catch(e){
    if (e.code==="PERMISSION_DENIED"||/permission/i.test(e.message)) return fail("sJoinErr","아직 준비 중인 보드예요. 선생님께 알려주세요.");
    return fail("sJoinErr","입장 확인 실패: "+e.message);
  }
  $("sEnterNamed").onclick = () => enterStudent(code, ($("sName").value||"").trim() || "익명");
  $("sEnterAnon").onclick  = () => enterStudent(code, "익명");
  $("sName").addEventListener("keydown", e=>{ if(e.key==="Enter") $("sEnterNamed").click(); });
}

// ════════ 학생 — 화이트보드 ════════
async function enterStudent(code, name){
  hide("sJoin"); show("student");
  ensureAudio();
  const meRef = ref(db,`boards/${code}/participants/${uid}`);
  await set(meRef, { name, ts:serverTimestamp() });
  onDisconnect(meRef).remove();

  let prevCount = 0, curText = "";
  onValue(ref(db,`boards/${code}/live`), s => {
    const L = s.val(); const stage=$("stageS");
    if (!L || !L.count){ prevCount=0; curText=""; $("copyCur").style.display="none";
      stage.innerHTML='<p class="wb-wait">선생님이 시작하기를 기다리고 있어요…</p>'; return; }
    const all = normLines(L.lines);
    curText = all[L.count-1] || "";                 // 현재 페이지(단계) 것만
    stage.innerHTML = `<p class="wb-line${L.count===1?" wb-base":""}">${esc(curText)}</p>`;
    $("copyCur").style.display="";
    if (prevCount!==0 && prevCount!==L.count){ flip(stage); playFlip(); }
    prevCount = L.count;
  });

  $("copyCur").onclick = async () => {
    if (!curText) return toast("아직 시작 전이에요.");
    try{ await navigator.clipboard.writeText(curText); toast("복사 완료! AI에 붙여넣으세요."); }
    catch{ toast("복사 실패 — 길게 눌러 직접 복사해주세요."); }
  };
}
